spring.application.name=backend
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/codespace?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# H2 Console (Disabled for MySQL, set to false unless using an in-memory DB)
spring.h2.console.enabled=false

jwt.secret=YourSecretKeyForJwtSigningMustBeAtLeast32BytesLong!
jwt.expiration=86400000